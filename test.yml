name: tests
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/          # zero-dependency unit tests

  db:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_DB_TESTS == 'true' }}   # enable once DATABASE_URL secret is set
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL tests (rolled-back / read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # a Supabase branch or test DB — NOT prod
        run: bash tests/run-db.sh

  e2e:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E_TESTS == 'true' }}   # enable once SUPABASE_* + BASE_URL secrets are set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e
